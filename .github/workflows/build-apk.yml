name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'NursingProject.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract project
        shell: bash
        run: |
          rm -rf android-project
          mkdir android-project
          unzip -q NursingProject.zip -d android-project

      - name: Build debug APK
        working-directory: android-project
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare APK
        shell: bash
        run: |
          cp android-project/app/build/outputs/apk/debug/app-debug.apk NursingDocumentationV4.apk
          ls -lh NursingDocumentationV4.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NursingDocumentationV4-APK
          path: NursingDocumentationV4.apk
          if-no-files-found: error
          retention-days: 30
