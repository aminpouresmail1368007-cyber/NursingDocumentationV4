name: Build Android APK Fixed

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'NursingProject.zip'
      - '.github/workflows/build-apk-fixed.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 16 SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract project
        run: |
          mkdir android-project
          unzip -q NursingProject.zip -d android-project

      - name: Build APK
        working-directory: android-project
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare APK
        run: |
          cp android-project/app/build/outputs/apk/debug/app-debug.apk NursingDocumentationV4.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NursingDocumentationV4-APK
          path: NursingDocumentationV4.apk
